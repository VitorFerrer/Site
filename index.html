<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogos digitais</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <header>
        <h1>Bem vindo ao site destinado a venda de jogos</h1>
        <h2>Atendemos com qualidade</h2>
    </header>
    <section class="carrosel">
        <img src="img/J1.jpg" alt="jogo1" class="slide active">
        <img src="img/J2.jpg" alt="jogo2" class="slide active">
        <img src="img/J3.jpg" alt="jogo3" class="slide active">
        
    </section>

    <section class="Contato">
        <h2>Fomulário de contato</h2>
        <form action="" id="frmContato">
            <input type="text" name="nomeContato" placeholder="Digite seu nome" required>
            <input type="email" name="email" placeholder="Digite seu email" required>

            <textarea name="mensagem" placeholder="Digite sua mensagem" required></textarea>
            <button type="submit">Enviar sugestão</button>

        </form>
    </section>

    <section class="mapa">
        <h2>Nos encontre</h2>
        <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d29505.11176802166!2d-50.579243850000026!3d-22.423794600000008!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1spt-BR!2sbr!4v1790638480575!5m2!1spt-BR!2sbr" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
        
    </section>

    <section class="whatsapp">
        <a href="https://web.whatsapp.com/" target="_blank"> <img src="img/zap.png" alt="" style="width: 60px;"></a>

    </section>

    <footer>
        <p>@Copy.2026 Meu negócio local. Todos os direitos reservados</p>
    </footer>
</body>
</html>
